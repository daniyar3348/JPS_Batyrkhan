# Serves the editorial workspace and proxies the API on the same origin, so the session cookie
# and CSRF protection work without CORS. TLS is terminated in front of this server (stage 7).

# Sign-in, registration and reset attempts per address. Generous because universities often share one
# address between many people; guessing one account's password is stopped by the per-account lockout.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
# Public read API: generous, but stops scrapers from hammering the database.
limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;

upstream api {
    server api:8000;
    keepalive 16;
}

map $http_x_request_id $request_id_out {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Only JSON goes through the API; files are uploaded straight to object storage.
    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Answer rate-limited requests like the API does, so the workspace shows a clear message.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        return 429 '{"type":"urn:jps:error:too_many_requests","title":"Too many requests","status":429,"detail":"Too many attempts from your network. Wait a minute and try again.","code":"too_many_requests"}';
    }

    location ~ ^/api/v1/auth/(login|register|password-reset) {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy-api.inc;
        proxy_pass http://api;
    }

    location /public/ {
        limit_req zone=public burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy-api.inc;
        proxy_pass http://api;
    }

    location ~ ^/(api|health|ready)(/|$) {
        include /etc/nginx/conf.d/proxy-api.inc;
        proxy_pass http://api;
    }

    # Hashed file names: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
