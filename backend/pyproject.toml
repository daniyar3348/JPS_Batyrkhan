[project]
name = "jps-backend"
version = "0.1.0"
description = "Journal platform: editorial workflow API and worker"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.12",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "boto3-stubs[s3]>=1.44.12",
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "moto[server]>=5.2.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["B008"]  # FastAPI dependencies are declared as default arguments

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; this only flags long strings and comments it cannot wrap.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core does not depend on modules or the API layer"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.api", "app.main", "app.worker"]

[[tool.importlinter.contracts]]
name = "Modules do not depend on the API layer"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api", "app.main", "app.worker"]
