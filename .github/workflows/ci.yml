name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jps
          POSTGRES_PASSWORD: jps
          POSTGRES_DB: jps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jps -d jps_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      JPS_TEST_DATABASE_URL: postgresql+asyncpg://jps:jps@localhost:5432/jps_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run lint-imports
      - run: uv run pytest -q

  frontend:
    name: Frontends (lint, types, tests) and workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome check .
      - run: npm run check
      - run: npm test
      - run: npm run build

  site:
    # Its types, lint and tests run with the workspace's (npm run check, npm test cover every package).
    name: Journal site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Without an API, as in the Docker build: pages are built empty and rebuilt at run time.
      - run: npm run build --workspace @jps/site

  api-client:
    name: API client matches the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
      - run: npm run generate:api
      - name: Fail if the generated client is out of date
        run: git diff --exit-code -- packages/api-client
